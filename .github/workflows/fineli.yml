# Hämtar Finelis öppna data (CC BY 4.0, THL) och checkar in
# public/fineli.json på samma gren. Körs när skriptet ändras och manuellt
# (Actions → Fineli-data → Run workflow). Checkar bara in om själva
# livsmedlen ändrats – ett nytt hämtningsdatum räcker inte.
name: Fineli-data

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/fineli.yml
      - scripts/fetch-fineli.ts
      - src/lib/fineliImport.ts
      - src/lib/livsmedelFormat.ts

permissions:
  contents: write
  actions: write

concurrency:
  group: fineli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Kod 2 = fineli.fi gick inte att nå eller hade inget paket: varning, filen lämnas orörd.
      - name: Hämta Fineli
        id: fetch
        run: |
          set +e
          npm run fineli
          code=$?
          if [ "$code" -eq 2 ]; then
            echo "::warning::fineli.fi gick inte att nå – public/fineli.json lämnas oförändrad. Kör workflowet manuellt senare eller ange FINELI_ZIP_URL."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$code"
      - name: Kontrollera filen
        if: steps.fetch.outputs.skip != 'true'
        run: |
          node -e '
            const f = JSON.parse(require("fs").readFileSync("public/fineli.json", "utf8"));
            console.log(`${f.foods.length} livsmedel, hämtade ${f.retrieved}`);
            if (f.foods.length < 1000) throw new Error("Orimligt få livsmedel – checkar inte in.");
          '
      - name: Checka in om livsmedlen ändrats
        if: steps.fetch.outputs.skip != 'true'
        id: commit
        run: |
          if git diff --quiet -I '"retrieved"' -- public/fineli.json; then
            echo "Livsmedlen är oförändrade."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/fineli.json
          git commit -m 'Update Fineli food data'
          # Livsmedelsdata-workflowet kan ha checkat in på samma gren under tiden.
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # Pushar med GITHUB_TOKEN startar inga workflows – starta CI resp. publiceringen själv.
      - name: Kör CI på den nya committen
        if: steps.commit.outputs.changed == 'true' && github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref "$GITHUB_REF_NAME"
      - name: Publicera
        if: steps.commit.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
