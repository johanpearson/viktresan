name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, bygg
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  lighthouse:
    name: Lighthouse CI (PWA, tillgänglighet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      # 0.13.x kör Lighthouse 11 – den sista versionen med PWA-kategorin och
      # installable-manifest. Krav: installerbar PWA och tillgänglighet ≥ 90 (lighthouserc.json).
      - run: npx --yes @lhci/cli@0.13.0 autorun
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: lhci-report
          retention-days: 7

  e2e:
    name: Playwright (Pixel 7)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  visual:
    name: Visuella regressionstester
    runs-on: ubuntu-latest
    # Samma avbild som baslinjerna i e2e/__screenshots__ togs i (scripts/visual.sh):
    # identiska typsnitt och Chromium, annars skiljer sig kantutjämningen.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:visual
        env:
          PLAYWRIGHT_IMAGE: '1'
          # Fast bygginfo (maskeras ändå i skärmdumparna).
          APP_COMMIT: visual
          APP_BUILD_TIME: '2026-01-01T00:00:00Z'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diff
          path: |
            test-results
            playwright-report
          retention-days: 7
